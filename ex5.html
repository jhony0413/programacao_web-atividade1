<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de série</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            align-items: center;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        main {
            background: rgb(240, 240, 240);
            border-radius: 10px;
            box-shadow: 0px 5px 10px 0px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 25%;
            padding: 40px;
            width: auto;
        }

        label {
            color: rgb(0, 0, 0);
            font-size: 1.2rem;
            font-weight: bold;
        }

        input {
            border: 1px solid rgb(200, 200, 200);
            border-radius: 5px;
            font-size: 1rem;
            padding: 10px;
        }

        input:focus {
            outline: none;
            outline: solid 1px rgb(0, 64, 128);
        }

        button {
            background-color: rgb(0, 128, 255);
            border: none;
            border-radius: 5px;
            color: rgb(255, 255, 255);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: rgb(0, 64, 128);
        }

        .gradmensagem {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }

        .gradmensagem.ativo {
            grid-template-rows: 1fr;
        }

        .mensagem {
            overflow: hidden;
        }

        #mensagem {
            opacity: 0;
            transition: opacity 0.3s ease-in-out 0.2s;
        }

        .gradmensagem.ativo #mensagem {
            opacity: 1;
        }
    </style>
</head>

<body>
    <main>
        <label id="comando" for="resposta">Digite um número para descobrir a soma da série ((10^0) + (10^1) + (10^2) +
            (10^3)... + (10^n))</label>
        <input id="resposta" type="number">
        <button id="botao" onclick="calcularSerieUm()">Calcular</button>
        <div class="gradmensagem" id="gradmensagem">
            <div class="mensagem">
                <p id="mensagem"></p>
            </div>
        </div>
    </main>

    <script>
        function calcularSerieUm() {
            let respUsuario = Number(document.getElementById("resposta").value);
            let valorAtual = 0;
            let soma = 0;
            for (let i = 0; i < respUsuario; i++) {
                valorAtual += 10 ** i;
                soma += valorAtual;
            }
            console.log(`${soma}`);
            document.getElementById("mensagem").textContent = "Abra o console do navegador para ver o resultado.";
            document.getElementById("gradmensagem").classList.add("ativo");
        }
    </script>
</body>

</html>
