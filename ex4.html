<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triângulo de Asteriscos</title>

    <style>
        body {
            background-color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Triângulo de Asteriscos</h1>
    <p>Abra o console do navegador para ver o resultado.</p>

    <script>
        let numCamadas = prompt("Escolha o número de camadas do triângulo:");
        let camada = "*";
        for (let i = 1; i <= numCamadas; i++) {
            console.log(camada);
            camada += "*";
        }
    </script>
</body>

</html>
